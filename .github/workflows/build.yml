name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build --no-write-lock-file .#sddm-ddlc-theme .#sayori-cursors
      # The theme must stay copy-installable: everything the QML references has to be inside it
      - name: theme is self-contained
        run: |
          theme=$(nix path-info --no-write-lock-file .#sddm-ddlc-theme)/share/sddm/themes/ddlc
          for f in Main.qml theme.conf metadata.desktop assets/noise.png assets/just-monika-ok.png; do
            test -e "$theme/$f" || { echo "missing $f"; exit 1; }
          done
          test "$(ls "$theme"/assets/*-sticker-*.png | wc -l)" -eq 12
      # Cursors ship prebuilt; catch a checkout where they rotted or a symlink lost its target
      - name: prebuilt cursors are intact
        run: |
          icons=$(nix path-info --no-write-lock-file .#sayori-cursors)/share/icons/sayori-cursors
          test -e "$icons/index.theme"
          test "$(find "$icons/cursors" -type f | wc -l)" -eq 2
          find "$icons/cursors" -type l | while read -r l; do
            test -e "$l" || { echo "dangling: $l"; exit 1; }
          done
      # theme.conf is generated and committed; this proves the committed copy is current
      - name: theme.conf is current
        run: nix build --no-write-lock-file .#checks.x86_64-linux.theme-conf-current
      - run: nix fmt -- --ci

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#shellcheck -- install.sh cursors/build-cursors.sh
      - run: nix run nixpkgs#shfmt -- -d -i 2 -ci install.sh cursors/build-cursors.sh
