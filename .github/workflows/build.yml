name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - run: nix build --no-write-lock-file .#sddm-ddlc-theme .#sayori-cursors
      # theme-conf-current, theme-is-self-contained, cursors-are-intact, module-wiring, nixos-eval
      - run: nix flake check --no-write-lock-file
      # The theme must stay usable without Nix: install.sh copies the tree under a prefix, and
      # --no-configure keeps it out of /etc, which is the half a runner has no business having
      - name: install.sh works
        run: |
          ./install.sh --prefix "$PWD/out" --no-configure
          test -f out/share/sddm/themes/ddlc/Main.qml
          test -f out/share/sddm/themes/ddlc/theme.conf
          test -e out/share/icons/sayori-cursors/index.theme
          PREFIX=/usr ./install.sh --destdir "$PWD/stage-theme" --component theme
          test -f stage-theme/usr/share/sddm/themes/ddlc/Main.qml
          test ! -e stage-theme/usr/share/icons/sayori-cursors
          test -f stage-theme/etc/sddm.conf.d/10-ddlc.conf
          DESTDIR=$PWD/stage-cursors PREFIX=/usr ./install.sh --component cursors
          test ! -e stage-cursors/usr/share/sddm/themes/ddlc
          test -f stage-cursors/usr/share/icons/sayori-cursors/index.theme
          test ! -e stage-cursors/etc/sddm.conf.d/10-ddlc.conf
          DESTDIR=$PWD/legacy PREFIX=/usr ./install.sh --no-cursors --no-configure
          test -f legacy/usr/share/sddm/themes/ddlc/Main.qml
          test ! -e legacy/usr/share/icons/sayori-cursors
          test ! -e legacy/etc/sddm.conf.d/10-ddlc.conf
          ! DESTDIR=$PWD/bad PREFIX=usr ./install.sh >/dev/null 2>&1
      - run: nix fmt -- --ci

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#shellcheck -- install.sh cursors/build-cursors.sh
      - run: nix run nixpkgs#shfmt -- -d -i 2 -ci install.sh cursors/build-cursors.sh
