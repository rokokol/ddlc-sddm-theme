name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31

      - name: VERSION matches CHANGELOG
        run: |
          ver=$(cat VERSION)
          grep -qF "## [$ver]" CHANGELOG.md || {
            echo "VERSION says $ver but CHANGELOG.md has no ## [$ver] heading" >&2
            exit 1
          }

      - run: nix build --no-write-lock-file .#sddm-ddlc-theme .#sayori-cursors
      # theme-conf-current, theme-is-self-contained, cursors-are-intact, module-wiring,
      # nixos-eval, scripts-lint, installer-suite
      - run: nix flake check --no-write-lock-file

      # The full installer contract lives in tests/installer.sh (run by flake check);
      # this is the smoke that the same script behaves on a real filesystem outside the
      # sandbox. --no-configure keeps it out of the runner's real /etc
      - name: install.sh works
        run: |
          ./install.sh --prefix "$PWD/out" --no-configure
          test -f out/share/sddm/themes/ddlc/Main.qml
          test -f out/share/sddm/themes/ddlc/theme.conf
          test -e out/share/icons/sayori-cursors/index.theme
          test -f out/share/ddlc-sddm-theme/install-manifest
          ./install.sh --prefix "$PWD/out" --uninstall --component cursors
          test ! -e out/share/icons/sayori-cursors
          test -f out/share/sddm/themes/ddlc/Main.qml
          ./install.sh --prefix "$PWD/out" --uninstall
          test ! -e out/share/ddlc-sddm-theme
          test ! -e out/share/sddm/themes/ddlc
          PREFIX=/usr ./install.sh --destdir "$PWD/stage-theme" --component theme
          test -f stage-theme/usr/share/sddm/themes/ddlc/Main.qml
          test ! -e stage-theme/usr/share/icons/sayori-cursors
          test -f stage-theme/etc/sddm.conf.d/10-ddlc.conf
          DESTDIR=$PWD/stage-cursors PREFIX=/usr ./install.sh --component cursors
          test ! -e stage-cursors/usr/share/sddm/themes/ddlc
          test -f stage-cursors/usr/share/icons/sayori-cursors/index.theme
          test ! -e stage-cursors/etc/sddm.conf.d/10-ddlc.conf
          DESTDIR=$PWD/legacy PREFIX=/usr ./install.sh --no-cursors --no-configure
          test -f legacy/usr/share/sddm/themes/ddlc/Main.qml
          test ! -e legacy/usr/share/icons/sayori-cursors
          test ! -e legacy/etc/sddm.conf.d/10-ddlc.conf
          # if-form, not `! cmd`: -e ignores negated pipelines, so a `! cmd` line only
          # bites while it happens to be the last one — anyone appending disarms it
          if DESTDIR=$PWD/bad PREFIX=usr ./install.sh >/dev/null 2>&1; then
            echo "a relative PREFIX was accepted" >&2
            exit 1
          fi

      - run: nix fmt -- --ci

  # The one file list lives in the flake's scripts-lint check — this job is a fast,
  # separately-named status for it, not a second copy of the commands
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      # nix run/shell nixpkgs#tool is a mirror-fate lookup — whatever nixpkgs the runner
      # resolves today decides the job. Tools a workflow needs live in the flake's dev
      # shell, pinned by the lock, reached with nix develop
      # Every vendored copy is byte-equal to its source: one edited here instead of at the
      # source fails by name — see .github/vendor.lock
      - name: vendored copies are byte-equal to their source
        run: ./vendor-sync.sh check
      - name: CI tools come from the lock, not the registry
        run: ./check-pins.sh
      - run: nix build --no-write-lock-file .#checks.x86_64-linux.scripts-lint
